<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Dictionary</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
  <header><img class="logo" src="icons/icon128.png" alt=""><div><h1 data-i18n="title">Local Dictionary</h1><p>v1.0.0</p></div></header>
  <section class="language-section"><label for="uiLanguage" class="language-title">界面语言 / 介面語言 / Interface language / 表示言語 / 인터페이스 언어</label><select id="uiLanguage"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></section>
  <label class="row switch-row"><span><strong data-i18n="enabled">Enable lookup</strong></span><input id="enabled" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
  <label class="row switch-row"><span><strong data-i18n="selection">Lookup selected text</strong><small data-i18n="selectionDesc">Look up the exact selected text in any language, including phrases</small></span><input id="selectionToLookup" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
  <label class="row switch-row"><span><strong data-i18n="autoLookup">输入时自动查词</strong><small data-i18n="autoLookupDesc">开启后，编辑词条窗口里的查询词时自动重新查词</small></span><input id="autoLookupOnEdit" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
  <label class="row switch-row"><span><strong data-i18n="hover">Lookup on hover</strong><small data-i18n="hoverDesc">Click or select a word by default</small></span><input id="hoverToShow" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
  <label class="row switch-row"><span><strong data-i18n="missingPopup">Show popup when no entry is found</strong><small data-i18n="missingPopupDesc">Off: no popup for missing click, hover or selection results. Manual searches still explain misses.</small></span><input id="showMissingPopup" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
  <section class="position-section"><label for="demandPopupPosition" data-i18n="position">Popup position</label><select id="demandPopupPosition"><option value="below" data-i18n="below">Below</option><option value="above" data-i18n="above">Above</option></select></section>
  <section class="dictionary-section"><label data-i18n="dictionary">My MDX dictionaries</label><p class="hint" data-i18n="dictionaryHint">Import multiple .mdx files; add their same-named .mdd resources if available.</p><div id="dictionaryList" class="dictionary-list"></div><button id="importMdx" type="button" data-i18n="importChange">Import MDX / MDD</button><input id="mdxFile" type="file" accept=".mdx,.mdd" multiple hidden></section>
  <section><label for="testWord" data-i18n="testLabel">Test dictionary lookup</label><div class="test-row"><input id="testWord" type="search" placeholder="example"><button id="testLookup" type="button" data-i18n="search">Search</button></div><div id="testResults" class="test-results"></div></section>
  <p class="hint" data-i18n="privacy">Dictionary files stay on this device. Entries are shown as isolated, non-executable HTML.</p>
  <p id="status" role="status"></p>
</main>
<script src="popup.js"></script>
</body>
</html>
